[package]
name = "progrust"
version = "0.1.0"
description = "Rust プログラミング学習アプリ"
edition = "2024"
rust-version = "1.100.0"
publish = false
# src/bin/ に判定だけを行うプログラム（progrust-judge）があるので、`tauri dev`・`tauri build`・`cargo run` が起動する
# 実行ファイルを、アプリ（src/main.rs）にする（ADR 0208）。
default-run = "progrust"

[features]
# 教材チェックツールが使う、判定だけを行うプログラム（progrust-judge）をビルドする（ADR 0208、ADR 0222）。
# `tauri build` は、ビルドした実行ファイルをすべて .app に入れるので、この feature を付けたときだけビルドし、
# アプリには入れない。
content-check = []

[[bin]]
name = "progrust-judge"
path = "src/bin/progrust-judge.rs"
required-features = ["content-check"]

[[test]]
name = "judge_cli"
required-features = ["content-check"]

[lib]
# バイナリ（main.rs）と名前が重ならないように、ライブラリの名前に `_lib` を付ける。
name = "progrust_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 学習者データのファイルを退避するときの名前に付ける日時（現地時刻）。
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# 学習者のプログラムのプロセスグループを止める（killpg）、刈り取らずに終わりを待つ（waitid）
# （spec/exercise-runner/run.md「停止」）。
libc = "0.2.191"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 初回準備の記録（prepared.json）の crates_hash（spec/exercise-runner/crates-and-workspace.md「初回準備」）。
sha2 = "0.11.1"
# 許可クレートの一覧（runner/allowed-crates.toml）を読む（spec/exercise-runner/project-assembly.md）。
toml = "1.2.2"
# `protocol-asset`: 動画の音声をアセットプロトコル（asset://）で読む（spec/architecture/tauri-permissions.md）。
tauri = { version = "~2.12.7", features = ["protocol-asset"] }
# 導入手順の URL を OS の既定ブラウザで開く（spec/architecture/tauri-permissions.md）。npm の
# `@tauri-apps/plugin-opener` と同じ系列にそろえる（spec/architecture/development-environment.md）。
tauri-plugin-opener = "~2.7.3"

[dev-dependencies]
# Tauri のモックの実行環境（`tauri::test`）でコマンドを確かめる。
tauri = { version = "~2.12.7", features = ["test"] }
# テストごとの一時ディレクトリ（spec/non-functional/testing.md「自動テストで確かめるもの」）。
tempfile = "3.27.0"

# Tauri の資料の推奨に合わせる: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
