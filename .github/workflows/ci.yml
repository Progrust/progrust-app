# push と pull request のたびに、コミット前の確認、教材チェックツール、デザインシステムの検査を実行する
# （documents/spec/non-functional/testing.md「CI」）。
# 実行環境は ubuntu-latest で、対応環境（作者の Mac）ではない。本番ビルドは作らない。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 実行マシンのディスクの使用量を減らす（Issue #189）。CI では差分のビルドを使わず、デバッグ情報も作らない。
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node.js と npm は development-environment.md の系列（package.json の engines）に合わせる。
      - uses: actions/setup-node@v7
        with:
          node-version: "25.9"
          cache: npm

      # Rust は rustup の stable を使う（rust-toolchain.toml は置かない）。
      - name: Rust ツールチェーン（stable）
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable

      # Tauri が Linux でのビルドに要るライブラリ（https://v2.tauri.app/start/prerequisites/）。
      - name: Tauri のビルドに要るライブラリ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: 版の表示
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          python3 --version

      - name: ディスクの空き（キャッシュを戻す前）
        run: df -h /

      # 依存の取り直しとビルドの時間を減らす。キャッシュするのは、依存のクレートのビルドの結果と
      # cargo のレジストリだけで、アプリ自身のビルドの結果と、使わなくなったものは保存の前に消える。
      # キャッシュが大きくなり続けないように、保存は main への push のときだけにする（Issue #189）。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: ディスクの空き（キャッシュを戻した後）
        run: df -h /

      - run: npm ci

      # cargo のコマンドは、package.json のスクリプトが --locked で実行する。
      - run: npm run check

      # 教材チェックツール（documents/spec/content-guidelines/check-tool.md）。エラーがあると失敗する。
      # 描画の検査に要る、画面なしの Chrome は、ツールが用意する。
      - run: npm run content:check

      - run: python3 tools/design-system.py check

      - name: ディスクの空き（最後）
        if: always()
        run: |
          df -h /
          du -sh src-tauri/target 2>/dev/null || true
