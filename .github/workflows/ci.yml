# push と pull request のたびに、秘密の情報の検査、コミット前の確認、教材チェックツール、デザインシステムの検査を実行する
# （documents/spec/non-functional/testing.md「CI」）。
# 実行環境は ubuntu-latest で、対応環境（作者の Mac）ではない。本番ビルドは作らない。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 実行マシンのディスクの使用量を減らす（Issue #189）。CI では差分のビルドを使わず、デバッグ情報も作らない。
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # 秘密の情報の検査（gitleaks）。Tauri のビルドで長い check のジョブを待たずに、すぐ結果が出るように分ける。
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    env:
      # 固定した gitleaks の版と、公式のリリースの gitleaks_8.30.1_checksums.txt にある
      # gitleaks_8.30.1_linux_x64.tar.gz の SHA-256。版を変えるときは、tools/check-secrets.py の
      # GITLEAKS_VERSION と development-environment.md の表を、同じ変更で直す。
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # 履歴の全部を取る。取らないと、最後の 1 コミットしか確かめられない。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks を入れる
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # 検査のスクリプトのテスト（本物の git と gitleaks を使う）。
      - run: python3 -I tools/tests/test_check_secrets.py

      # 取ってきたすべての参照から届くコミットの履歴全体と、作業ツリーを確かめる。gitleaks の版も確かめる。
      - run: python3 -I tools/check-secrets.py --all

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node.js と npm は development-environment.md の系列（package.json の engines）に合わせる。
      - uses: actions/setup-node@v7
        with:
          node-version: "25.9"
          cache: npm

      # Rust は rustup の stable を使う（rust-toolchain.toml は置かない）。
      - name: Rust ツールチェーン（stable）
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable

      # Tauri が Linux でのビルドに要るライブラリ（https://v2.tauri.app/start/prerequisites/）。
      - name: Tauri のビルドに要るライブラリ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: 版の表示
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          python3 --version

      - name: ディスクの空き（キャッシュを戻す前）
        run: df -h /

      # 依存の取り直しとビルドの時間を減らす。キャッシュするのは、依存のクレートのビルドの結果と
      # cargo のレジストリだけで、アプリ自身のビルドの結果と、使わなくなったものは保存の前に消える。
      # キャッシュが大きくなり続けないように、保存は main への push のときだけにする（Issue #189）。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: ディスクの空き（キャッシュを戻した後）
        run: df -h /

      - run: npm ci

      # cargo のコマンドは、package.json のスクリプトが --locked で実行する。
      - run: npm run check

      # 教材チェックツール（documents/spec/content-guidelines/check-tool.md）。エラーがあると失敗する。
      # 描画の検査に要る、画面なしの Chrome は、ツールが用意する。
      - run: npm run content:check

      - run: python3 tools/design-system.py check

      - name: ディスクの空き（最後）
        if: always()
        run: |
          df -h /
          du -sh src-tauri/target 2>/dev/null || true
