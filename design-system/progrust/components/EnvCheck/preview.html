<!-- @dsCard group="通知とダイアログ" height=290 width=760 -->
<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>EnvCheck</title></head>
<body>
<div class="pg-demo pg-demo--col" style="max-width:720px">
  <ul class="pg-env">
    <li><span class="is-ok"><svg class="pg-icon " aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <path d="m9 12 2 2 4-4" /></svg></span><div><p class="pg-env-name">Rust ツールチェーン</p><p class="pg-env-detail">rustc 1.89.0 ・ <code>~/.cargo/bin/cargo</code></p></div><span class="pg-ok-line">使えます</span></li>
    <li><span class="is-ng"><svg class="pg-icon " aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /> <path d="M12 9v4" /> <path d="M12 17h.01" /></svg></span><div><p class="pg-env-name">Claude Code</p><p class="pg-env-detail">見つかりません。質問・学習の分析・問題生成は使えません。レッスンは続けられます。</p></div><a class="pg-btn pg-btn--sm" href="#">導入手順を見る</a></li>
    <li><span class="is-busy"><svg class="pg-icon pg-spin" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg></span><div><p class="pg-env-name">外部クレートの準備</p><p class="pg-env-detail">準備しています。終わるまで、外部クレートを使う演習は実行できません。</p></div><span class="pg-ok-line">準備中</span></li>
    <li><span class="is-error"><svg class="pg-icon " aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <line x1="12" x2="12" y1="8" y2="12" /> <line x1="12" x2="12.01" y1="16" y2="16" /></svg></span><div><p class="pg-env-name">外部クレートの準備</p><p class="pg-env-detail">準備に失敗しました。ネットワーク接続を確認してください。</p></div><button class="pg-btn pg-btn--sm">再試行</button></li>
  </ul>
</div>
</body>
</html>
