<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Banner</title></head>
<body>
<div class="pg-demo pg-demo--col" style="gap:10px">
  <div class="pg-banner" role="status"><svg class="pg-icon " aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /> <path d="M12 9v4" /> <path d="M12 17h.01" /></svg><p><b>Claude Code が見つかりません。</b>質問・学習の分析・問題生成は使えません。レッスンは続けられます。</p><button class="pg-btn pg-btn--outline">導入手順を見る</button></div>
  <div class="pg-banner pg-banner--info" role="status"><svg class="pg-icon " aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg><p><b>演習の準備をしています。</b>外部クレートを使う演習は、準備が終わるまで実行できません。</p></div>
  <div class="pg-banner pg-banner--ng" role="alert"><svg class="pg-icon " aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <line x1="12" x2="12" y1="8" y2="12" /> <line x1="12" x2="12.01" y1="16" y2="16" /></svg><p><b>演習の準備に失敗しました。</b>ネットワークにつながっているか確かめてください。</p><button class="pg-btn pg-btn--outline">再試行</button></div>
</div>
</body>
</html>
