<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>DifficultyPicker</title></head>
<body>
<div class="pg-demo pg-demo--col" style="max-width:560px">
  <div class="pg-seg" role="radiogroup" aria-label="難易度" style="align-self:flex-start">
    <button class="pg-seg-2line" role="radio" aria-checked="false">1</button>
    <button class="pg-seg-2line" role="radio" aria-checked="false">2<span class="pg-seg-rec">推奨</span></button>
    <button class="pg-seg-2line" role="radio" aria-checked="true">3</button>
    <button class="pg-seg-2line" role="radio" aria-checked="false">4</button>
    <button class="pg-seg-2line" role="radio" aria-checked="false">5</button>
  </div>
  <p class="pg-hint"><b>難易度 3</b><span>複数の要素を組み合わせ、境界のケースへの配慮がいる。解答は 50 行くらい。</span></p>
</div>
</body>
</html>
