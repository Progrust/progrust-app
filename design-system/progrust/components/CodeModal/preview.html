<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>CodeModal</title></head>
<body>
<div class="pg-scrim" style="height:360px;box-sizing:border-box">

    <div class="pg-code-modal-head"><div><h2 id="code-t">前回の正解コード</h2><p>10 月 28 日 21:14 に正解 ・ 編集中のコードは変わりません</p></div><button class="pg-icon-btn pg-icon-btn--md" aria-label="閉じる"><svg class="pg-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button></div>

      <div class="pg-editor-bar"><button class="pg-filetab" aria-selected="true">src/main.rs</button><button class="pg-filetab" aria-selected="false">src/suffix.rs</button></div>
      <div class="pg-editor-code"><span class="pg-ln">1
2
3</span><span><span class="tk-k">fn</span> <span class="tk-f">main</span>() {
    <span class="tk-k">let</span> name = <span class="tk-t">String</span>::<span class="tk-f">new</span>();
}</span></div>
    </div>
    <div class="pg-code-modal-foot"><button class="pg-btn pg-btn--lg">閉じる</button></div>
  </div>
</div>
</body>
</html>
