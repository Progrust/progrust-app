<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>ProblemPanel</title></head>
<body>
<div class="pg-demo pg-demo--col" data-chapter="4" style="max-width:400px;height:380px;box-sizing:border-box">
  <section class="pg-side" aria-label="問題文">
    <div class="pg-side-head">問題文<span class="pg-tag">テスト 3 件</span></div>
    <div class="pg-side-scroll">
      <div class="pg-prose">
        <h1>名前に接尾辞を付ける</h1>
        <p>標準入力から名前を 1 行読み取り、末尾に <code>_the_crab</code> を付けて表示するプログラムを完成させてください。</p>
        <h2>条件</h2>
        <ul><li><code>add_suffix</code> は引数の <code>String</code> の所有権を受け取る</li><li>名前の前後の空白は取り除く</li></ul>
        <h2>入力と出力の例</h2>
        <dl class="pg-io"><dt>入力</dt><dd><code>ferris</code></dd><dt>出力</dt><dd><code>ferris_the_crab</code></dd></dl>
      </div>
    </div>
  </section>
</div>
</body>
</html>
