<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>SettingsRow</title></head>
<body>
<div class="pg-demo pg-demo--col">
  <div class="pg-settings">
    <div class="pg-settings-row"><div><h3>テーマ</h3><p>「システムに合わせる」では OS の設定に追従します。</p></div><div class="pg-seg" role="radiogroup" aria-label="テーマ"><button role="radio" aria-checked="true">ライト</button><button role="radio" aria-checked="false">ダーク</button><button role="radio" aria-checked="false">システムに合わせる</button></div></div>
    <div class="pg-settings-row"><div><h3>Rust ツールチェーン</h3><p><code>/Users/learner/.cargo/bin/cargo</code>　cargo 1.91.0</p></div><button class="pg-btn">再検出</button></div>
    <div class="pg-settings-row"><div><h3>学習履歴をすべてリセット</h3><p>学習記録・分析・進捗・下書きを削除します。生成した問題は残ります。</p></div><button class="pg-btn">リセット…</button></div>
  </div>
  <h2 class="heading" style="margin:8px 0 0">動画</h2>
  <div class="pg-settings">
    <div class="pg-settings-row"><div><h3>音量とミュート</h3><p>動画の音量と、ミュートするかどうか。</p></div><div class="pg-volume"><button class="pg-icon-btn pg-icon-btn--md" aria-label="ミュート" aria-pressed="false"><svg class="pg-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /> <path d="M16 9a5 5 0 0 1 0 6" /> <path d="M19.364 18.364a9 9 0 0 0 0-12.728" /></svg></button><div class="pg-slider" role="slider" tabindex="0" aria-label="音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80" style="--pg-slider-value:0.8"><span class="pg-slider-track"><span class="pg-slider-fill"></span></span><span class="pg-slider-thumb"></span></div></div></div>
    <div class="pg-settings-row"><div><h3>再生速度</h3><p>動画を再生する速さ。</p></div><div class="pg-seg" role="radiogroup" aria-label="再生速度"><button role="radio" aria-checked="false">0.75 倍</button><button role="radio" aria-checked="true">1 倍</button><button role="radio" aria-checked="false">1.25 倍</button><button role="radio" aria-checked="false">1.5 倍</button><button role="radio" aria-checked="false">2 倍</button></div></div>
    <div class="pg-settings-row"><div><h3>字幕</h3><p>再生中の文を、動画の下に表示します。</p></div><label class="pg-switch"><input type="checkbox" role="switch">表示する</label></div>
  </div>
</div>
</body>
</html>
