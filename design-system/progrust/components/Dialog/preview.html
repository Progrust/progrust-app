<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Dialog</title></head>
<body>
<div class="pg-scrim" style="height:330px;box-sizing:border-box">
<div class="pg-dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
  <h2 id="dlg-t">学習履歴をすべてリセットしますか？</h2>
  <p>学習記録・分析・進捗・下書きを削除します。生成した問題は残ります。この操作は取り消せません。</p>
  <div class="pg-field"><label for="dlg-i">確認のため「リセット」と入力</label><input id="dlg-i" class="pg-input" placeholder="リセット"></div>
  <div class="pg-dialog-actions"><button class="pg-btn pg-btn--lg">キャンセル</button><button class="pg-btn pg-btn--lg pg-btn--danger" disabled>リセット</button></div>
</div>
</div>
</body>
</html>
