<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>TextField</title></head>
<body>
<div class="pg-demo pg-demo--col pg-demo--panel" style="gap:16px;max-width:480px">
  <div class="pg-field"><label for="tf1">cargo のパス</label><input id="tf1" class="pg-input pg-input--mono" value="/Users/learner/.cargo/bin/cargo"><span class="pg-field-help">空にすると自動で探します。</span></div>
  <div class="pg-field"><label for="tf2">確認のため「リセット」と入力</label><input id="tf2" class="pg-input" value="りせっと" aria-invalid="true"><span class="pg-field-error"><svg class="pg-icon " aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <line x1="12" x2="12" y1="8" y2="12" /> <line x1="12" x2="12.01" y1="16" y2="16" /></svg>「リセット」と入力してください</span></div>
  <textarea class="pg-textarea" rows="2" placeholder="この動画について質問" aria-label="この動画について質問"></textarea>
</div>
</body>
</html>
