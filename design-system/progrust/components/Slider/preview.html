<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Slider</title></head>
<body>
<div class="pg-demo pg-demo--col" style="gap:14px;max-width:420px">
  <div class="pg-slider" role="slider" tabindex="0" aria-label="音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60" style="--pg-slider-value:0.6"><span class="pg-slider-track"><span class="pg-slider-fill"></span></span><span class="pg-slider-thumb"></span></div>
  <div data-chapter="4"><div class="pg-slider pg-slider--accent" role="slider" tabindex="0" aria-label="再生位置" aria-valuemin="0" aria-valuemax="104" aria-valuenow="42" aria-valuetext="0 分 42 秒" style="--pg-slider-value:0.404"><span class="pg-slider-track"><span class="pg-slider-fill"></span><span class="pg-slider-mark" style="left:7.7%"></span><span class="pg-slider-mark" style="left:28.8%"></span><span class="pg-slider-mark" style="left:84.6%"></span></span><span class="pg-slider-thumb"></span></div></div>
  <div class="pg-slider" role="slider" aria-label="音量" aria-disabled="true" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30" style="--pg-slider-value:0.3"><span class="pg-slider-track"><span class="pg-slider-fill"></span></span><span class="pg-slider-thumb"></span></div>
</div>
</body>
</html>
