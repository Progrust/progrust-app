<!-- @dsCard group="演習" height=190 -->
<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Splitter</title></head>
<body>
<div class="pg-demo" style="gap:0;align-items:stretch;height:190px;box-sizing:border-box">
  <div style="flex:1;border-radius:14px;background:var(--panel)"></div>
  <div class="pg-split-v" role="separator" aria-orientation="vertical" aria-label="問題文とエディタの境界" tabindex="0"></div>
  <div style="flex:2;display:flex;flex-direction:column">
    <div style="flex:1;border-radius:14px;border:1px solid var(--line)"></div>
    <div class="pg-split-h" role="separator" aria-orientation="horizontal" aria-label="エディタとコンソールの境界" tabindex="0"></div>
    <div style="height:56px;border-radius:14px;background:var(--panel)"></div>
  </div>
</div>
</body>
</html>
