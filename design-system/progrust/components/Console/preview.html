<html lang="ja">
<head><meta charset="utf-8"><title>Console</title></head>
<body>
<div class="pg-demo pg-demo--col" data-chapter="4">
<div class="pg-console" style="height:268px">

    <div class="pg-console-actions">
      <span class="pg-running"><svg class="pg-icon pg-spin" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>実行中</span>

      <button class="pg-btn pg-btn--outline" disabled>テスト</button>
      <button class="pg-btn" disabled>提出</button>
      <button class="pg-btn pg-btn--outline"><svg class="pg-icon" aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>停止</button>
    </div>
  </div>

 <span class="ansi-blue ansi-bold">--&gt;</span> src/main.rs:3:9

<span class="pg-out-input">ferris</span>
年齢を入力してください:</pre>
    <label class="pg-stdin"><span>&gt;</span><input aria-label="標準入力" value="12"><button class="pg-btn pg-btn--sm">入力終了</button></label>
  </div>
</div>
</div>
