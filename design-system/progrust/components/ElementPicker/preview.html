<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>ElementPicker</title></head>
<body>
<div class="pg-demo pg-demo--col" style="max-width:560px">
  <div class="pg-picks">
    <span class="pg-pick"><span class="pg-badge pg-badge--sm" data-chapter="4">4</span>所有権のムーブ<button type="button" aria-label="所有権のムーブ を外す"><svg class="pg-icon " aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button></span>
    <span class="pg-pick"><span class="pg-badge pg-badge--sm" data-chapter="5">5</span>可変参照と不変参照<button type="button" aria-label="可変参照と不変参照 を外す"><svg class="pg-icon " aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button></span>
  </div>
  <div class="pg-acc">
    <div class="pg-acc-group">
      <button type="button" class="pg-acc-head" aria-expanded="true"><span class="pg-badge" data-chapter="5">5</span><span class="pg-acc-name">第5章　参照と借用</span><span class="pg-acc-sel">1 件選択</span><span class="pg-acc-count">6 要素</span><svg class="pg-icon " aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg></button>
      <div class="pg-acc-body">
        <div class="pg-el"><label class="pg-check"><input type="checkbox" checked><span class="pg-el-name">可変参照と不変参照</span></label><span class="pg-el-badges"><span class="pg-mastery pg-mastery--weak"><span class="pg-meter"><i class="on"></i><i></i><i></i><i></i></span>よく間違える</span></span></div>
        <div class="pg-el"><label class="pg-check"><input type="checkbox"><span class="pg-el-name">スライス</span></label><span class="pg-el-badges"><span class="pg-mastery-note">データ不足</span><span class="pg-mastery pg-mastery--stable"><span class="pg-meter"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span>安定</span></span></div>
      </div>
    </div>
    <div class="pg-acc-group">
      <button type="button" class="pg-acc-head" aria-expanded="false"><span class="pg-badge" data-chapter="6">6</span><span class="pg-acc-name">第6章　構造体</span><span class="pg-acc-count">6 要素</span><svg class="pg-icon " aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg></button>
    </div>
  </div>
  <span class="pg-count"><b>2</b> / 5 件を選択</span>
</div>
</body>
</html>
