<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>PassModal</title></head>
<body>
<div class="pg-scrim" style="height:460px;box-sizing:border-box" data-chapter="4">
  <div class="pg-pass" role="dialog" aria-modal="true" aria-labelledby="pass-t" style="max-height:420px">
    <div class="pg-pass-head">
      <span class="pg-pass-mark"><svg class="pg-icon " aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg></span>
      <div><h2 class="pg-pass-title" id="pass-t">正解</h2><p class="pg-pass-sub">3 件のテストがすべて通りました。4-6 関数と所有権 を完了しました。</p></div>
      <span class="pg-chip"><span class="pg-chip-num">4</span>所有権　6 / 7 完了</span>
      <button class="pg-icon-btn pg-icon-btn--md" aria-label="閉じてコードを見る"><svg class="pg-icon " aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button>
    </div>
    <div class="pg-pass-body">
      <div class="pg-pass-main">
        <div class="pg-pass-tabs"><div class="pg-tabs" role="tablist" aria-label="正解後の表示"><button class="pg-tab" role="tab" aria-selected="true">解説</button><button class="pg-tab" role="tab" aria-selected="false">問題文</button><button class="pg-tab" role="tab" aria-selected="false">提出したコード</button></div></div>
        <div class="pg-pass-scroll"><div class="pg-prose pg-prose--on-bg"><h1>戻り値で所有権を受け取り直す</h1><p><code>add_suffix</code> は <code>String</code> の所有権を受け取り、付け足した <code>String</code> を返します。呼び出し側は戻り値で受け取り直します。</p></div></div>
      </div>
      <aside class="pg-chat" aria-label="解説について質問">
        <div class="pg-chat-head"><h2>解説について質問する</h2></div>
        <div class="pg-chat-empty"><b>質問できるようになりました</b><p>解説の内容や、提出したコードと模範解答の違いについて質問できます。</p></div>
      </aside>
    </div>
    <div class="pg-pass-foot">
      <button class="pg-btn pg-btn--text">閉じてコードを見る</button>
      <button class="pg-btn pg-btn--lg">レッスン一覧へ</button>
      <button class="pg-btn pg-btn--accent pg-btn--xl">次のレッスンへ<span class="pg-btn-sub">4-7 第4章の復習</span></button>
    </div>
  </div>
</div>
</body>
</html>
