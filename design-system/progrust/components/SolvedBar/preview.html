<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>SolvedBar</title></head>
<body>
<div class="pg-demo pg-demo--col">
  <div class="pg-solved" data-chapter="4" role="status">
    <span class="pg-solved-mark"><svg class="pg-icon " aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg></span><span class="pg-solved-text">正解しました</span><span class="pg-solved-sub">エディタは読み取り専用になりました。</span>
    <div class="pg-solved-actions"><button class="pg-btn pg-btn--outline">解説を開く</button><button class="pg-btn">レッスン一覧へ</button><button class="pg-btn pg-btn--accent">次のレッスンへ</button></div>
  </div>
  <div class="pg-solved" role="status">
    <span class="pg-solved-mark"><svg class="pg-icon " aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg></span><span class="pg-solved-text">正解しました</span>
    <div class="pg-solved-actions"><button class="pg-btn pg-btn--outline">解説を開く</button><button class="pg-btn pg-btn--accent">生成問題一覧へ</button></div>
  </div>
</div>
</body>
</html>
