<!-- @dsCard group="動画" height=770 width=1040 -->
<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>VideoPlayer</title></head>
<body>
<div class="pg-demo pg-demo--col" data-chapter="4">
<div class="pg-video">
  <div class="pg-video-frame"><div style="position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--muted)">動画（中身は「Progrust Video」で描く）</div></div>
  <p class="pg-captions">ところが Rust では、元の変数が使えなくなることがあります。</p>
  <div class="pg-video-controls">
    <div class="pg-slider pg-slider--accent" role="slider" tabindex="0" aria-label="再生位置" aria-valuemin="0" aria-valuemax="104" aria-valuenow="42" aria-valuetext="0 分 42 秒" style="--pg-slider-value:0.404"><span class="pg-slider-track"><span class="pg-slider-fill"></span><span class="pg-slider-mark" style="left:7.7%"></span><span class="pg-slider-mark" style="left:28.8%"></span><span class="pg-slider-mark" style="left:84.6%"></span></span><span class="pg-slider-thumb"></span></div>
    <div class="pg-video-bar">
      <div class="pg-video-group">
        <button class="pg-icon-btn pg-icon-btn--ink" aria-label="再生" title="再生（Space）" aria-keyshortcuts="Space"><svg class="pg-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3" /></svg></button>
        <span class="pg-video-time"><b>0:42</b> / 1:44</span>
        <button class="pg-btn" aria-label="5 秒戻る" title="5 秒戻る（←）" aria-keyshortcuts="ArrowLeft"><svg class="pg-icon" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /> <path d="M3 3v5h5" /></svg>5 秒</button>
        <button class="pg-btn" aria-label="5 秒進む" title="5 秒進む（→）" aria-keyshortcuts="ArrowRight">5 秒<svg class="pg-icon" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /></svg></button>
      </div>
      <div class="pg-video-group">
        <div class="pg-select-wrap pg-select-wrap--pill"><select class="pg-select pg-select--pill" aria-label="再生速度"><option>0.75 倍</option><option selected>1 倍</option><option>1.25 倍</option><option>1.5 倍</option><option>2 倍</option></select><svg class="pg-icon" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg></div>
        <div class="pg-volume"><button class="pg-icon-btn pg-icon-btn--md" aria-label="ミュート" aria-pressed="false"><svg class="pg-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /> <path d="M16 9a5 5 0 0 1 0 6" /> <path d="M19.364 18.364a9 9 0 0 0 0-12.728" /></svg></button><div class="pg-slider" role="slider" tabindex="0" aria-label="音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80" style="--pg-slider-value:0.8"><span class="pg-slider-track"><span class="pg-slider-fill"></span></span><span class="pg-slider-thumb"></span></div></div>
        <button class="pg-btn" aria-pressed="true"><svg class="pg-icon" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="14" x="3" y="5" rx="2" ry="2" /> <path d="M7 15h4M15 15h2M7 11h2M13 11h4" /></svg>字幕</button>
      </div>
      <div class="pg-video-end"><button class="pg-btn pg-btn--accent pg-btn--lg">演習へ</button></div>
    </div>
  </div>
</div>
</div>
</body>
</html>
