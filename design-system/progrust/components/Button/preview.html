<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="pg-demo" data-chapter="4">
  <button class="pg-btn pg-btn--accent pg-btn--lg">演習へ</button>
  <a class="pg-btn pg-btn--accent pg-btn--xl" href="#">次のレッスンへ<span class="pg-btn-sub">4-5 clone と Copy</span></a>
  <button class="pg-btn pg-btn--ink">提出</button>
  <button class="pg-btn">動画を見直す</button>
  <button class="pg-btn pg-btn--sm pg-btn--text">初期コードに戻す</button>
  <button class="pg-btn pg-btn--danger">リセット</button>
</div>
<div class="pg-demo pg-demo--panel" data-chapter="4">
  <button class="pg-btn pg-btn--outline"><svg class="pg-icon" aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"></path></svg>実行</button>
  <button class="pg-btn pg-btn--ink">提出</button>
  <button class="pg-btn" disabled>停止</button>
  <button class="pg-btn pg-btn--outline pg-btn--lg">解説について質問する</button>
</div>
<div class="pg-demo">
  <span style="font-size:12px;color:var(--muted)">章外の画面</span>
  <button class="pg-btn pg-btn--accent pg-btn--xl">新しい問題を生成</button>
  <button class="pg-btn pg-btn--lg">生成問題一覧へ</button>
</div>
</body>
</html>
