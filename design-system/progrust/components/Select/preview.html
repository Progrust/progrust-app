<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Select</title></head>
<body>
<div class="pg-demo pg-demo--panel" style="gap:16px;align-items:flex-end">
  <div class="pg-field" style="width:220px"><label for="s1">質疑応答のモデル</label><div class="pg-select-wrap"><select id="s1" class="pg-select"><option>sonnet</option><option>opus</option><option>haiku</option></select><svg class="pg-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg></div></div>
  <div class="pg-field" style="width:140px"><label for="s2">エディタの文字サイズ</label><div class="pg-select-wrap"><select id="s2" class="pg-select"><option>14px</option></select><svg class="pg-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg></div></div>
</div>
<div class="pg-demo">
  <div class="pg-select-wrap pg-select-wrap--pill"><select class="pg-select pg-select--pill" aria-label="再生速度"><option>0.75 倍</option><option>1 倍</option><option selected>1.25 倍</option><option>1.5 倍</option><option>2 倍</option></select><svg class="pg-icon" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg></div>
</div>
</body>
</html>
