<!-- @dsCard group="通知とダイアログ" height=300 -->
<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Toast</title></head>
<body>
<div class="pg-demo pg-demo--col" style="align-items:flex-end;gap:10px;background:var(--bg)">
  <div class="pg-pop pg-toast" role="status"><svg class="pg-icon " aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <path d="m9 12 2 2 4-4" /></svg><div><p class="pg-toast-title">問題を生成しました</p><p class="pg-toast-body">所有権のムーブ・難易度 3 の問題が 1 問増えました。</p><div class="pg-toast-actions"><button class="pg-btn pg-btn--sm pg-btn--text">開く</button></div></div><button class="pg-icon-btn pg-icon-btn--md" aria-label="閉じる"><svg class="pg-icon " aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button></div>
  <div class="pg-pop pg-toast pg-toast--ng" role="alert"><svg class="pg-icon " aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <line x1="12" x2="12" y1="8" y2="12" /> <line x1="12" x2="12.01" y1="16" y2="16" /></svg><div><p class="pg-toast-title">問題の生成に失敗しました</p><p class="pg-toast-body">検証に 3 回通りませんでした。設定を変えてもう一度お試しください。</p><div class="pg-toast-actions"><button class="pg-btn pg-btn--sm pg-btn--text">生成設定を開く</button></div></div><button class="pg-icon-btn pg-icon-btn--md" aria-label="閉じる"><svg class="pg-icon " aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button></div>
</div>
</body>
</html>
