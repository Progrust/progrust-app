<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>JobPopover</title></head>
<body>
<div class="pg-demo" style="align-items:flex-start;background:var(--bg)">
<div class="pg-pop pg-jobs-pop" role="dialog" aria-label="ジョブ">
  <h2>ジョブ</h2>
  <div class="pg-job"><svg class="pg-icon " aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg><div><div class="pg-job-name">学習記録の作成</div><div class="pg-job-target">4-5 clone と Copy</div></div><span class="pg-job-state">実行中</span></div>
  <div class="pg-job pg-job--wait"><svg class="pg-icon " aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <polyline points="12 6 12 12 16 14" /></svg><div><div class="pg-job-name">分析の更新</div><div class="pg-job-target">学習記録 1 件</div></div><span class="pg-job-state">待機中</span></div>
  <div class="pg-jobs-pop-foot">AI のジョブは 1 件ずつ順に実行します</div>
</div>
</div>
</body>
</html>
