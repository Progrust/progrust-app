<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ダーク：生成設定画面</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/progrust/tokens.css">
<link rel="stylesheet" href="ds/progrust/components/bundle.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Murecho:wght@400;500;700;800&amp;family=Red+Hat+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<dc-import name="GenSettings" theme="{{theme}}" hint-size="100%,2370px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"$preview":{"width":1280,"height":2370}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark', yes: true, six: 6 };
  }
}
</script>
</body>
</html>
