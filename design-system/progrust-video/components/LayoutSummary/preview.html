  <h1>このレッスンのまとめ</h1>
  <ul>
    <li>代入すると、String の所有権は新しい変数に移る（ムーブ）</li>
    <li>ムーブした元の変数を使うと、ムーブ済みの値を使ったエラーになる</li>
    <li>関数に渡したときも、所有権は引数に移る</li>
    <li>i32 のようにコピーされる型は、代入しても元の変数を使える</li>
  </ul>
