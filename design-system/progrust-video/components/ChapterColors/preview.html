<!-- @dsCard group="色" height=1960 width=1360 subtitle="12 色の章カラーと章外（第4章の色）で同じ画面を描いた見本。上: ライト　下: ダーク" -->
<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>ChapterColors</title></head>
<body>
<div id="root"></div>
<template id="tpl">
<section class="video-stage" data-layout="two-column">
  <h1>第N章の色</h1>
  <div class="col">
    <pre><code class="language-rust"><span class="line"><span class="tk-k">let</span> s1 = <span class="tk-t">String</span>::<span class="tk-f">from</span>(<span class="tk-s">"hi"</span>);</span><span class="line"><span class="tk-k">let</span> s2 = <span class="mark">s1</span>;</span><span class="line"><span class="tk-m">println!</span>(<span class="tk-s">"{s2}"</span>);</span></code></pre>
    <div class="callout ok">s2 が所有者になります</div>
    <ul><li>主役は <strong class="c-primary">c-primary</strong></li><li><span class="mark">マーカー</span>は章によらず同じ</li></ul>
  </div>
  <div class="col">
    <figure class="diagram">
      <svg viewBox="0 0 544 300" width="544" height="300" role="img" aria-label="s1 は使えなくなり、s2 がヒープ上の hi を指す">
        <rect class="fill-muted" x="0" y="0" width="544" height="300" rx="20" stroke="none"/>
        <rect class="fill-surface stroke-muted" x="24" y="32" width="200" height="72" rx="12" stroke-dasharray="8 6"/>
        <text class="code fill-muted" x="52" y="68" dominant-baseline="central">s1</text>
        <rect class="fill-primary" x="24" y="160" width="200" height="72" rx="12" stroke="none"/>
        <text class="code fill-on" x="52" y="196" dominant-baseline="central">s2</text>
        <path class="stroke-primary" d="M224 196 H 290" stroke-width="3"/>
        <path class="stroke-primary" d="M282 188 L 292 196 L 282 204" stroke-width="3"/>
        <rect class="fill-accent stroke-accent" x="304" y="164" width="64" height="64" rx="8"/>
        <rect class="fill-accent stroke-accent" x="380" y="164" width="64" height="64" rx="8"/>
        <text class="code fill-accent" x="336" y="196" text-anchor="middle" dominant-baseline="central">h</text>
        <text class="code fill-accent" x="412" y="196" text-anchor="middle" dominant-baseline="central">i</text>
        <path class="stroke-ng" d="M460 61 l14 14 M474 61 l-14 14" stroke-width="3"/>
        <text class="fill-ng" x="486" y="68" dominant-baseline="central" font-size="18">誤</text>
      </svg>
    </figure>
  </div>
</section>
</template>
<script>
  var names = ['青', '緑', '橙', 'マゼンタ', '紫', '茶', '青緑', '空色', '紺', 'オリーブ', '梅紫', '若葉'];
  var tpl = document.getElementById('tpl');
  var root = document.getElementById('root');
  ['light', 'dark'].forEach(function (theme) {
    var band = document.createElement('div');
    band.setAttribute('data-theme', theme);
    band.className = 'vd-theme vd-band';
    var h = document.createElement('p');
    h.className = 'vd-h';
    h.textContent = theme === 'light' ? 'ライト' : 'ダーク（案）';
    band.appendChild(h);
    var grid = document.createElement('div');
    grid.className = 'vd-grid';
    grid.style.padding = '0';
    for (var n = 1; n <= 14; n++) {
      var cell = document.createElement('div');
      var cap = document.createElement('p');
      cap.className = 'vd-cap';
      cap.textContent = n <= 12 ? ('第' + n + '章 ' + names[n - 1] + '（chapter-' + n + '）') : (n === 13 ? '章外: data-chapter なし（第4章の色）' : '章外: data-chapter="none"（第4章の色）');
      var thumb = document.createElement('div');
      thumb.className = 'vd-thumb';
      var scope = document.createElement('div');
      if (n <= 12) scope.setAttribute('data-chapter', String(n));
      if (n === 14) scope.setAttribute('data-chapter', 'none');
      var stage = tpl.content.firstElementChild.cloneNode(true);
      stage.querySelector('h1').textContent = n <= 12 ? ('第' + n + '章の色') : '章外';
      scope.appendChild(stage);
      thumb.appendChild(scope);
      cell.appendChild(cap);
      cell.appendChild(thumb);
      grid.appendChild(cell);
    }
    band.appendChild(grid);
    root.appendChild(band);
  });
</script>
</body>
</html>
