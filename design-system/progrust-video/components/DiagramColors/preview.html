<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>DiagramColors</title></head>
<body>
<div class="vd-stack">
<div data-theme="light" class="vd-theme"><div data-chapter="4">
<section class="video-stage" data-layout="diagram" data-lesson-label="図の色クラス（ライト）">
  <h1>図の色クラス（第4章の例）</h1>
  <figure class="diagram">
    <svg viewBox="0 0 1136 480" width="1136" height="480" role="img" aria-label="図の色クラスの一覧">
      <text class="fill-muted" x="0" y="16" font-size="18">クラス</text><text class="fill-muted" x="260" y="16" font-size="18">塗り（fill-*）</text><text class="fill-muted" x="560" y="16" font-size="18">線（stroke-*）</text><text class="fill-muted" x="840" y="16" font-size="18">文字（text に fill-*）</text>
      <text class="code" x="0" y="84" dominant-baseline="central">*-primary</text>
      <rect class="fill-primary" x="260" y="56" width="240" height="56" rx="12" stroke="none"/>
      <text class="fill-on" x="380" y="84" text-anchor="middle" dominant-baseline="central">主役</text>
      <path class="stroke-primary" d="M560 84 H 760" stroke-width="3"/>
      <path class="stroke-primary" d="M750 74 L 762 84 L 750 94" stroke-width="3"/>
      <text class="fill-primary" x="840" y="84" dominant-baseline="central">主役の文字</text>
      <text class="code" x="0" y="156" dominant-baseline="central">*-accent</text>
      <rect class="fill-accent stroke-accent" x="260" y="128" width="240" height="56" rx="12"/>
      <text class="fill-accent" x="380" y="156" text-anchor="middle" dominant-baseline="central">補助</text>
      <path class="stroke-accent" d="M560 156 H 760" stroke-width="3"/>
      <path class="stroke-accent" d="M750 146 L 762 156 L 750 166" stroke-width="3"/>
      <text class="fill-accent" x="840" y="156" dominant-baseline="central">補助の文字</text>
      <text class="code" x="0" y="228" dominant-baseline="central">*-ok</text>
      <rect class="fill-ok" x="260" y="200" width="240" height="56" rx="12" stroke="none"/>
      <path class="stroke-on" d="M330 228 l7 7 l14 -14" stroke-width="3"/>
      <text class="fill-on" x="362" y="228" dominant-baseline="central">正しい</text>
      <path class="stroke-ok" d="M560 228 H 760" stroke-width="3"/>
      <path class="stroke-ok" d="M750 218 L 762 228 L 750 238" stroke-width="3"/>
      <path class="stroke-ok" d="M840 228 l7 7 l14 -14" stroke-width="3"/>
      <text class="fill-ok" x="872" y="228" dominant-baseline="central">正しいの文字</text>
      <text class="code" x="0" y="300" dominant-baseline="central">*-ng</text>
      <rect class="fill-ng" x="260" y="272" width="240" height="56" rx="12" stroke="none"/>
      <path class="stroke-on" d="M334 293 l14 14 M348 293 l-14 14" stroke-width="3"/>
      <text class="fill-on" x="362" y="300" dominant-baseline="central">誤り</text>
      <path class="stroke-ng" d="M560 300 H 760" stroke-width="3"/>
      <path class="stroke-ng" d="M750 290 L 762 300 L 750 310" stroke-width="3"/>
      <path class="stroke-ng" d="M842 293 l14 14 M856 293 l-14 14" stroke-width="3"/>
      <text class="fill-ng" x="872" y="300" dominant-baseline="central">誤りの文字</text>
      <text class="code" x="0" y="372" dominant-baseline="central">*-muted</text>
      <rect class="fill-muted stroke-muted" x="260" y="344" width="240" height="56" rx="12" stroke-dasharray="8 6"/>
      <text class="fill-muted" x="380" y="372" text-anchor="middle" dominant-baseline="central">使えない</text>
      <path class="stroke-muted" d="M560 372 H 760" stroke-width="3" stroke-dasharray="8 6"/>
      <path class="stroke-muted" d="M750 362 L 762 372 L 750 382" stroke-width="3"/>
      <text class="fill-muted" x="840" y="372" dominant-baseline="central">使えないの文字</text>
      <text class="code" x="0" y="444" dominant-baseline="central">（クラスなし）</text>
      <rect x="260" y="416" width="240" height="56" rx="12"/>
      <text x="380" y="444" text-anchor="middle" dominant-baseline="central">既定</text>
      <path d="M560 444 H 760" stroke-width="3"/>
      <path d="M750 434 L 762 444 L 750 454" stroke-width="3"/>
      <text x="840" y="444" dominant-baseline="central">既定の文字</text>
    </svg>
  </figure>
</section>
</div></div>
