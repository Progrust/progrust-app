<section class="video-stage" data-layout="content" data-lesson-label="4-4 所有権のムーブ">
  <h1>所有権には 3 つのルールがある</h1>
  <p>Rust はガベージコレクタを使わず、次のルールでメモリを管理します。ルールを守っているかは、コンパイラがコンパイル時に検査します。</p>
  <ol>
    <li>値には、<strong>所有者</strong>と呼ばれる変数が 1 つだけある</li>
    <li>所有者は、同時に 2 つ以上存在しない</li>
    <li>所有者がスコープを抜けると、値は<span class="mark">自動で破棄される</span></li>
  </ol>
  <div class="callout info">Java や Python のように、実行中に不要なメモリを探して回収する仕組みはありません。</div>
</section>
