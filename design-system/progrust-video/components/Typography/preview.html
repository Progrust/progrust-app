<section class="video-stage" data-layout="content" data-lesson-label="5-1 不変の参照">
  <h1>参照は、値を借りるための矢印</h1>
  <p>関数に <code>&amp;s</code> を渡すと、所有権は移らず<strong>参照</strong>だけが渡ります。呼び出したあとも s を<em>そのまま</em>使えます。</p>
  <h2>借りた側は、値を書き換えられない</h2>
  <p>書き換えたいときは可変参照（<code>&amp;mut</code>）を使います。<br>可変参照は次のレッスンで扱います。</p>
</section>
