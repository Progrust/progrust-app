<!-- @dsCard group="レイアウト" height=720 width=1280 subtitle="data-layout=&quot;two-column&quot; 左右 2 列（比較）" -->
<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>LayoutTwoColumn</title></head>
<body>
<!-- 共通部品が出力する HTML の形（コードは行と字句に分けられている。見本は動かない）。TSX での書き方は README を見る -->
<div data-chapter="4">
<section class="video-stage" data-layout="two-column" data-lesson-label="4-5 clone と Copy">
  <h1>i32 はコピーされ、String はムーブされる</h1>
  <div class="col">
    <h2>i32（コピー）</h2>
    <pre><code class="language-rust"><span class="line"><span class="tk-k">let</span> a = <span class="tk-n">5</span>;</span><span class="line"><span class="tk-k">let</span> b = <span class="mark">a</span>;</span><span class="line"><span class="tk-m">println!</span>(<span class="tk-s">"{a} {b}"</span>);</span></code></pre>
    <div class="callout ok">a も b も使えます</div>
  </div>
  <div class="col">
    <h2>String（ムーブ）</h2>
    <pre><code class="language-rust"><span class="line"><span class="tk-k">let</span> s1 = <span class="tk-t">String</span>::<span class="tk-f">from</span>(<span class="tk-s">"hi"</span>);</span><span class="line"><span class="tk-k">let</span> s2 = <span class="mark">s1</span>;</span><span class="line"><span class="tk-m">println!</span>(<span class="tk-s">"{<span class="error">s1</span>}"</span>);</span></code></pre>
    <div class="callout ng">s1 はムーブ済みなので使えません（E0382）</div>
  </div>
</section>
</div>
</body>
</html>
