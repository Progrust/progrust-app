<!doctype html>

<div data-chapter="3">
<section class="video-stage" data-layout="content" data-lesson-label="3-4 文字列">
  <h1>&amp;str は借りる型、String は持つ型</h1>
  <p><code>"hello"</code> のような文字列リテラルの型は <code>&amp;str</code> です。書き換えられる文字列が必要なときは <code>String::from</code> で String を作ります。</p>
  <ul>
    <li><code>&amp;str</code>: 文字列を借りて読むための型</li>
    <li>String: 文字列を所有し、伸ばしたり縮めたりできる型</li>
  </ul>
  <div class="callout tip">関数の引数は <code>&amp;str</code> にすると、どちらの文字列も渡せます。</div>
  <table>
    <thead><tr><th>型</th><th>持ち主</th><th>長さを変える</th></tr></thead>
    <tbody>
      <tr><td><code>&amp;str</code></td><td>ほかの誰か</td><td>できない</td></tr>
      <tr><td><code>String</code></td><td>自分</td><td>できる</td></tr>
    </tbody>
  </table>
</section>
</div>
</body>
</html>
