<section class="video-stage" data-layout="code" data-lesson-label="4-3 clone で複製する">
  <h1>clone() はヒープのデータまで複製する</h1>
  <p>ムーブではなく複製したいときは、<code>clone()</code> を<span class="mark">自分で呼んで明示します</span>。Rust は高くつく複製を勝手には行いません。</p>
  <pre><code class="language-rust"><span class="line"><span class="tk-k">let</span> s1 = <span class="tk-t">String</span>::<span class="tk-f">from</span>(<span class="tk-s">"hi"</span>);</span><span class="line"><span class="tk-k">let</span> s2 = s1.<span class="mark"><span class="tk-f">clone</span>()</span>;</span><span class="line"><span class="tk-m">println!</span>(<span class="tk-s">"{s1} {s2}"</span>); <span class="tk-c">// どちらも使える</span></span></code></pre>
</section>
