<!-- @dsCard group="図" height=720 width=1280 subtitle="定型の図: 借用（参照の矢印）。ムーブは LayoutDiagram、生きている範囲は CodeScope" -->
<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>DiagramPatterns</title></head>
<body>
<div class="vd-stack">
<div data-chapter="5">
<section class="video-stage" data-layout="diagram" data-lesson-label="5-1 不変の参照">
  <h1>参照は、所有者を指す矢印</h1>
  <figure class="diagram">
    <svg viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="r は s を指し、s がヒープ上の hello を指す">
      <rect class="fill-muted" x="0" y="0" width="400" height="360" rx="20" stroke="none"/>
      <rect class="fill-muted" x="560" y="0" width="440" height="360" rx="20" stroke="none"/>
      <text class="fill-muted" x="28" y="40" font-size="18">スタック</text>
      <text class="fill-muted" x="588" y="40" font-size="18">ヒープ</text>
      <!-- 借りる側 r: 補助 -->
      <rect class="fill-accent stroke-accent" x="40" y="64" width="320" height="80" rx="12"/>
      <text class="code fill-accent" x="72" y="104" dominant-baseline="central">r</text>
      <text class="code fill-accent" x="336" y="104" text-anchor="end" dominant-baseline="central" font-size="18">&amp;s</text>
      <path class="stroke-accent" d="M200 144 V 206" stroke-width="3"/>
      <path class="stroke-accent" d="M190 198 L 200 208 L 210 198" stroke-width="3"/>
      <text class="fill-accent" x="216" y="180" dominant-baseline="central" font-size="18" font-weight="500">借りている</text>
      <!-- 所有者 s: 主役 -->
      <rect class="fill-primary" x="40" y="216" width="320" height="80" rx="12" stroke="none"/>
      <text class="code fill-on" x="72" y="256" dominant-baseline="central">s</text>
      <text class="fill-on" x="336" y="256" text-anchor="end" dominant-baseline="central" font-size="18" font-weight="500">所有者</text>
      <path class="stroke-primary" d="M360 256 H 586" stroke-width="3"/>
      <path class="stroke-primary" d="M578 248 L 588 256 L 578 264" stroke-width="3"/>
      <rect class="fill-accent stroke-accent" x="600" y="224" width="64" height="64" rx="8"/>
      <rect class="fill-accent stroke-accent" x="676" y="224" width="64" height="64" rx="8"/>
      <rect class="fill-accent stroke-accent" x="752" y="224" width="64" height="64" rx="8"/>
      <rect class="fill-accent stroke-accent" x="828" y="224" width="64" height="64" rx="8"/>
      <rect class="fill-accent stroke-accent" x="904" y="224" width="64" height="64" rx="8"/>
      <text class="code fill-accent" x="632" y="256" text-anchor="middle" dominant-baseline="central">h</text>
      <text class="code fill-accent" x="708" y="256" text-anchor="middle" dominant-baseline="central">e</text>
      <text class="code fill-accent" x="784" y="256" text-anchor="middle" dominant-baseline="central">l</text>
      <text class="code fill-accent" x="860" y="256" text-anchor="middle" dominant-baseline="central">l</text>
      <text class="code fill-accent" x="936" y="256" text-anchor="middle" dominant-baseline="central">o</text>
    </svg>
  </figure>
  <p>r は s を指しているだけです。所有者は s のままで、r が消えても値は残ります。</p>
</section>
</div>
</div>
</body>
</html>
